name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS payload JSON
        required: false
        type: string

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Move stray blog images to public/blog-images
        run: node scripts/fix-blog-media-paths.mjs

      - name: Validate blog paths and frontmatter
        run: node scripts/validate-blog-content.mjs

      - name: Verify redirect table
        run: npm run cf:redirects:verify

      - name: Fail if the committed public/_redirects is out of date
        run: npm run cf:redirects:check

      - name: Build production site
        run: npm run build

      - name: Deploy site Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy legacy redirect Worker
        run: npm run deploy:legacy-redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
